
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#B85C1F;--ac2:#DC823C;--acl:#F5E6CC;
  --acp:rgba(184,92,31,.08);--acpm:rgba(184,92,31,.16);
  --td:#1a0e06;--tm:#6b5a4e;--tt:#b09a8a;
  --ee:cubic-bezier(.16,1,.3,1);--es:cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeUp  {from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn  {from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer {0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes tagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes countIn {from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes searchGlow{0%{box-shadow:0 0 0 0 rgba(184,92,31,.3)}70%{box-shadow:0 0 0 8px rgba(184,92,31,0)}100%{box-shadow:0 0 0 0 rgba(184,92,31,0)}}
@keyframes emptyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sbcursor{0%,100%{opacity:1}50%{opacity:0}}

/* Page */
.page{background:#fafaf8;min-height:100vh;font-family:'DM Sans',sans-serif;padding-bottom:80px}

/* ── Hero banner ── */
.cat-hero{
  position:relative;background:linear-gradient(135deg,#1a0e06 0%,#2d1506 40%,#B85C1F 100%);
  padding:64px clamp(16px,4.5vw,52px) 80px;
  overflow:hidden;text-align:center;
}
.cat-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(184,92,31,.35) 0%,transparent 70%);
}
/* Floating food emojis */
.cat-hero-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco-item{position:absolute;font-size:2rem;opacity:.12;animation:tagFloat var(--dur,4s) ease-in-out infinite var(--del,0s)}
.cat-hero-tag{font-size:.72rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:12px;animation:fadeUp .6s var(--ee) .1s both;position:relative;z-index:1}
.cat-hero-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:900;color:#fff;line-height:1.12;margin-bottom:12px;animation:fadeUp .7s var(--ee) .18s both;position:relative;z-index:1}
.cat-hero-title em{font-style:italic;color:var(--ac2)}
.cat-hero-sub{font-size:clamp(.88rem,1.8vw,1rem);color:rgba(255,255,255,.65);max-width:480px;margin:0 auto 32px;line-height:1.68;animation:fadeUp .7s var(--ee) .26s both;position:relative;z-index:1}
/* Stats row */
.cat-stats{display:flex;align-items:center;justify-content:center;gap:32px;position:relative;z-index:1;animation:fadeUp .7s var(--ee) .34s both;flex-wrap:wrap}
.cat-stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.cat-stat-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:#fff;line-height:1}
.cat-stat-l{font-size:.62rem;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em}
.cat-stat-div{width:1px;height:32px;background:rgba(255,255,255,.15)}

/* ── Search bar ── */
.cat-search-wrap{
  max-width:540px;margin:-26px auto 0;
  padding:0 clamp(16px,4.5vw,52px);
  position:relative;z-index:10;
  animation:fadeUp .6s var(--ee) .42s both;
}
.cat-search-inner{
  display:flex;align-items:center;
  background:#fff;border-radius:50px;
  border:1.5px solid rgba(184,92,31,.18);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
  padding:6px 6px 6px 18px;
  transition:border-color .25s,box-shadow .25s,transform .22s var(--es);
}
.cat-search-inner:focus-within{
  border-color:var(--ac);
  box-shadow:0 0 0 4px rgba(184,92,31,.10),0 8px 32px rgba(0,0,0,.12);
  transform:scale(1.02);
  animation:searchGlow .6s ease-out;
}
.cat-search-ico{color:var(--ac);flex-shrink:0;margin-right:10px;display:flex}
.categories-search{
  flex:1;border:none;outline:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--td);
  caret-color:var(--ac);
}
.categories-search::placeholder{color:var(--tt)}
.cat-search-clear{
  width:30px;height:30px;border-radius:50%;border:none;background:transparent;
  color:var(--tt);cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.7);pointer-events:none;
  transition:opacity .2s var(--es),transform .2s var(--es),color .15s,background .15s;
}
.cat-search-clear.vis{opacity:1;transform:scale(1);pointer-events:auto}
.cat-search-clear:hover{color:var(--ac);background:var(--acp)}
.cat-search-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 20px;background:var(--ac);color:#fff;
  border:none;border-radius:999px;font-size:.84rem;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:background .2s,transform .2s var(--es);
}
.cat-search-btn:hover{background:#9e4a14;transform:scale(1.04)}

/* ── Main section ── */
.cat-main{max-width:1280px;margin:0 auto;padding:40px clamp(16px,4.5vw,52px) 0}
.cat-results-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:10px;
  animation:fadeUp .5s var(--ee) .5s both;
}
.cat-results-txt{font-size:.84rem;color:var(--tt)}
.cat-results-txt strong{color:var(--td);font-weight:600}
/* View toggle */
.cat-view-toggle{display:flex;gap:4px}
.vbtn{width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(184,92,31,.15);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tt);transition:all .2s var(--es)}
.vbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* ── Grid ── */
.categories-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1024px){.categories-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px) {.categories-grid{grid-template-columns:repeat(2,1fr);gap:14px}}

/* ── Category Card ── */
.category-card{
  background:#fff;border-radius:20px;overflow:hidden;
  border:1px solid rgba(184,92,31,.10);
  box-shadow:0 4px 18px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  cursor:pointer;
  opacity:0;animation:cardIn .55s var(--ee) calc(var(--ci)*.07s + .52s) forwards;
  transform-style:preserve-3d;
  transition:box-shadow .28s ease;
  position:relative;
}
.category-card:hover{box-shadow:0 20px 50px rgba(0,0,0,.11),0 6px 14px rgba(184,92,31,.10)}
.category-card:active{transform:scale(.98)!important}

/* Image */
.category-image-wrap{position:relative;height:155px;overflow:hidden}
.category-image{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ee)}
.category-card:hover .category-image{transform:scale(1.08)}
/* Overlay */
.cat-card-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(26,14,6,.6) 100%);opacity:0;transition:opacity .3s}
.category-card:hover .cat-card-overlay{opacity:1}
/* Recipe count badge */
.cat-card-count{
  position:absolute;bottom:10px;right:10px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  font-size:.58rem;font-weight:700;color:var(--ac);
  padding:3px 9px;border-radius:999px;
  border:1px solid rgba(184,92,31,.2);
  opacity:0;transform:translateY(4px);
  transition:opacity .3s,transform .3s var(--es);
  z-index:2;
}
.category-card:hover .cat-card-count{opacity:1;transform:translateY(0)}
/* Number circle (top-left) */
.cat-card-num{
  position:absolute;top:10px;left:10px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(184,92,31,.85);backdrop-filter:blur(6px);
  color:#fff;font-size:.62rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.2);
  animation:countIn .4s var(--es) calc(.6s + var(--ci)*.07s) both;
  z-index:2;
}

/* Card body */
.category-body{padding:13px 15px 15px}
.category-name{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:700;color:var(--td);margin-bottom:5px;line-height:1.2}
.category-desc{font-size:.72rem;color:var(--tt);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.category-meta{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;font-weight:600;color:var(--ac);
  background:var(--acp);padding:5px 12px;border-radius:999px;
  border:1px solid rgba(184,92,31,.14);
  transition:background .2s,transform .2s var(--es);
}
.category-card:hover .category-meta{background:var(--acpm);transform:translateY(-1px)}
.category-meta svg{transition:transform .2s var(--es)}
.category-card:hover .category-meta svg{transform:translateX(3px)}

/* ── Skeleton ── */
.cat-skeleton{background:#fff;border-radius:20px;overflow:hidden;border:1px solid rgba(184,92,31,.08)}
.cat-sk-img{height:155px;background:linear-gradient(90deg,#f5f0eb 25%,#ede8e2 50%,#f5f0eb 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite}
.cat-sk-body{padding:13px 15px}
.cat-sk-line{height:9px;border-radius:6px;margin-bottom:8px;background:linear-gradient(90deg,#f5f0eb 25%,#ede8e2 50%,#f5f0eb 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite}
.cat-sk-line.s{width:55%}.cat-sk-line.btn{width:45%;height:24px;border-radius:999px;margin-top:12px}

/* ── Empty ── */
.categories-empty{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;
  padding:60px 20px;text-align:center;
}
.cat-empty-icon{width:72px;height:72px;border-radius:50%;background:var(--acp);border:2px dashed rgba(184,92,31,.25);display:flex;align-items:center;justify-content:center;color:var(--ac);margin-bottom:16px;animation:emptyBob 3s ease-in-out infinite}
.cat-empty-h{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--td);margin-bottom:6px}
.cat-empty-p{font-size:.84rem;color:var(--tt);max-width:260px;line-height:1.6}

@media(max-width:480px){
  .cat-hero{padding:48px 16px 64px}
  .cat-hero-title{font-size:clamp(1.7rem,7vw,2.2rem)}
  .cat-stats{gap:20px}
  .cat-search-btn span{display:none}.cat-search-btn{padding:10px 13px}
}
</style>

<div class="page">

  <!-- Hero Banner -->
  <div class="cat-hero">
    <div class="cat-hero-deco">
      <span class="deco-item" style="top:12%;left:8%;--dur:5s;--del:0s">🍕</span>
      <span class="deco-item" style="top:20%;right:10%;--dur:6s;--del:1s">🍜</span>
      <span class="deco-item" style="bottom:20%;left:15%;--dur:4.5s;--del:.5s">🥩</span>
      <span class="deco-item" style="bottom:30%;right:8%;--dur:5.5s;--del:1.5s">🍰</span>
      <span class="deco-item" style="top:50%;left:4%;--dur:7s;--del:.2s">🥗</span>
      <span class="deco-item" style="top:40%;right:4%;--dur:4s;--del:.8s">🦐</span>
    </div>
    <p class="cat-hero-tag">Browse by Category</p>
    <h1 class="cat-hero-title">Explore Every <em>Cuisine</em></h1>
    <p class="cat-hero-sub">From Italian pasta to Indian curries — discover recipes across 14 delicious categories</p>
    <div class="cat-stats">
      <div class="cat-stat"><span class="cat-stat-n">14</span><span class="cat-stat-l">Categories</span></div>
      <div class="cat-stat-div"></div>
      <div class="cat-stat"><span class="cat-stat-n">50K+</span><span class="cat-stat-l">Recipes</span></div>
      <div class="cat-stat-div"></div>
      <div class="cat-stat"><span class="cat-stat-n">25+</span><span class="cat-stat-l">Cuisines</span></div>
    </div>
  </div>

  <!-- Search -->
  <div class="cat-search-wrap">
    <div class="cat-search-inner">
      <span class="cat-search-ico">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input class="categories-search" id="catSearch" type="text" placeholder="Search categories... e.g. Chicken, Pasta" autocomplete="off">
      <button class="cat-search-clear" id="catClr">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="cat-search-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
    </div>
  </div>

  <!-- Main -->
  <div class="cat-main">
    <div class="cat-results-row">
      <p class="cat-results-txt" id="resultsTxt">Showing <strong>14</strong> categories</p>
      <div class="cat-view-toggle">
        <button class="vbtn on" title="Grid view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="vbtn" title="List view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="categories-grid" id="catGrid"></div>
  </div>
</div>

<script>
const CATS = [
  {id:'1',name:'Beef',      desc:'Rich and hearty beef dishes from around the world. Perfect for meat lovers.',      thumb:'https://www.themealdb.com/images/category/beef.png',      count:'57 recipes'},
  {id:'2',name:'Chicken',   desc:'Versatile chicken recipes from grilled to curried, for every occasion.',           thumb:'https://www.themealdb.com/images/category/chicken.png',   count:'38 recipes'},
  {id:'3',name:'Dessert',   desc:'Sweet treats and indulgent desserts to satisfy your sweet tooth cravings.',        thumb:'https://www.themealdb.com/images/category/dessert.png',   count:'64 recipes'},
  {id:'4',name:'Lamb',      desc:'Tender lamb preparations from Mediterranean to Middle Eastern cuisines.',          thumb:'https://www.themealdb.com/images/category/lamb.png',      count:'30 recipes'},
  {id:'5',name:'Pasta',     desc:'Italian and international pasta dishes from creamy to tomato-based sauces.',       thumb:'https://www.themealdb.com/images/category/pasta.png',     count:'27 recipes'},
  {id:'6',name:'Pork',      desc:'Flavourful pork recipes including roasts, stir fries and more.',                  thumb:'https://www.themealdb.com/images/category/pork.png',      count:'26 recipes'},
  {id:'7',name:'Seafood',   desc:'Fresh and delicious seafood recipes — grilled, baked, or curried.',               thumb:'https://www.themealdb.com/images/category/seafood.png',   count:'42 recipes'},
  {id:'8',name:'Vegetarian',desc:'Wholesome plant-based dishes bursting with colour and nutrition.',                 thumb:'https://www.themealdb.com/images/category/vegetarian.png',count:'16 recipes'},
  {id:'9',name:'Breakfast', desc:'Start your day right with these energising breakfast recipes.',                    thumb:'https://www.themealdb.com/images/category/breakfast.png', count:'7 recipes'},
  {id:'10',name:'Goat',     desc:'Slow-cooked goat dishes inspired by African and Caribbean traditions.',            thumb:'https://www.themealdb.com/images/category/goat.png',      count:'5 recipes'},
  {id:'11',name:'Vegan',    desc:'100% plant-based recipes that are healthy, tasty and satisfying.',                thumb:'https://www.themealdb.com/images/category/vegan.png',     count:'1 recipe'},
  {id:'12',name:'Miscellaneous',desc:'Unique recipes that don\'t fit a single category — always a surprise!',       thumb:'https://www.themealdb.com/images/category/miscellaneous.png',count:'42 recipes'},
  {id:'13',name:'Side',     desc:'Perfect accompaniments and side dishes to complement any main course.',           thumb:'https://www.themealdb.com/images/category/side.png',      count:'3 recipes'},
  {id:'14',name:'Starter',  desc:'Appetisers and starters to kick off your meal in style.',                         thumb:'https://www.themealdb.com/images/category/starter.png',   count:'6 recipes'},
];

const grid = document.getElementById('catGrid');
const search = document.getElementById('catSearch');
const clr = document.getElementById('catClr');
const resTxt = document.getElementById('resultsTxt');

function renderCats(list) {
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = `<div class="categories-empty">
      <div class="cat-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      <h3 class="cat-empty-h">No categories found</h3>
      <p class="cat-empty-p">Try searching with a different keyword</p>
    </div>`;
    resTxt.innerHTML = 'No categories found';
    return;
  }
  resTxt.innerHTML = `Showing <strong>${list.length}</strong> categor${list.length===1?'y':'ies'}`;
  list.forEach((cat,i) => {
    const card = document.createElement('div');
    card.className = 'category-card';
    card.style.setProperty('--ci', i);
    card.innerHTML = `
      <div class="category-image-wrap">
        <span class="cat-card-num">${i+1}</span>
        <div class="cat-card-overlay"></div>
        <span class="cat-card-count">${cat.count}</span>
        <img class="category-image" src="${cat.thumb}" alt="${cat.name}" loading="lazy">
      </div>
      <div class="category-body">
        <h3 class="category-name">${cat.name}</h3>
        <p class="category-desc">${cat.desc}</p>
        <div class="category-meta">
          Explore Recipes
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>`;
    // 3D tilt
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = ((e.clientX-r.left)/r.width-.5)*14;
      const y = ((e.clientY-r.top)/r.height-.5)*-14;
      card.style.transform = `translateY(-8px) scale(1.02) perspective(700px) rotateY(${x}deg) rotateX(${y}deg)`;
    });
    card.addEventListener('mouseleave', ()=>{ card.style.transform=''; });
    grid.appendChild(card);
  });
}

renderCats(CATS);

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  clr.classList.toggle('vis', q.length>0);
  renderCats(q ? CATS.filter(c=>c.name.toLowerCase().includes(q)) : CATS);
});
clr.addEventListener('click', ()=>{ search.value=''; clr.classList.remove('vis'); renderCats(CATS); search.focus(); });

// View toggle
document.querySelectorAll('.vbtn').forEach((btn,i)=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    if(i===1){grid.style.gridTemplateColumns='1fr';}
    else{grid.style.gridTemplateColumns='';}
  });
});
</script>
